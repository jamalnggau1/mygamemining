<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>ASTRA MINING — Tambang Luar Angkasa P2E</title>
    <!-- Telegram WebApp JS: menyediakan window.Telegram.WebApp
         (initData, ready/expand) saat game dibuka sebagai Mini App.
         Di browser biasa script ini tetap dimuat tapi window.Telegram
         tidak dipakai — semua akses ke WebApp dijaga (guard) di
         client/src/api.ts dan main.tsx. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- AdsGram SDK: iklan reward untuk tombol "Tonton Iklan" (Reward
         format). Script resmi dari docs.adsgram.ai — hanya menyediakan
         window.Adsgram; tidak aktif sampai blockId diisi di
         client/src/ads.ts (pemilik mendaftarkan Mini App di
         partner.adsgram.ai). -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="dalam-tanah-p2e"
    ></div>
  </body>
</html>
